name: Setup workspace
description: Bun, Node, native build deps and a workspace install — shared by every JS job.

# The test phase runs as several parallel jobs and each one starts from a bare
# runner, so this setup is repeated per job rather than shared through a
# filesystem. Keeping it here means the Node version, the Bun version and the
# apt list are declared once: bumping them in five copies is how they drift.

inputs:
  node-version:
    description: Node major to install.
    default: "22"
  system-deps:
    description: >-
      Install the native libraries the canvas-backed packages build against,
      plus the fd/ripgrep binaries the tools suites shell out to. Set false for
      jobs that only read the repo.
    default: "true"
  install:
    description: Run `bun install`. Set false for jobs that need no dependencies.
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    # Bun comes from oven-sh/setup-bun, not `npm install --global`: the npm
    # global prefix lives under the runner's /opt toolcache, and /opt is
    # group- or world-writable there. The gateway refuses to exec a runtime
    # under such an ancestor ("writable by others: /opt", spawn-primitive.ts
    # assertSafeExecutablePath), which failed every gateway spawn test.
    # setup-bun installs into ~/.bun/bin, owned by the runner user. The
    # version is still the exact manifest pin, and the revision is asserted.
    - name: Read the manifest-pinned Bun
      id: bun-pin
      shell: bash
      run: |
        BUN_PACKAGE_VERSION="$(node -p "require('./package.json').packageManager.replace(/^bun@/, '')")"
        EXPECTED_BUN_REVISION="$(node -p "require('./package.json').drahtReleaseBunRevision")"
        echo "version=${BUN_PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
        echo "revision=${EXPECTED_BUN_REVISION}" >> "$GITHUB_OUTPUT"

    - name: Install the manifest-pinned Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.bun-pin.outputs.version }}

    - name: Verify the Bun revision
      shell: bash
      env:
        EXPECTED_BUN_REVISION: ${{ steps.bun-pin.outputs.revision }}
      run: |
        ACTUAL_BUN_REVISION="$(bun --revision)"
        test "${ACTUAL_BUN_REVISION}" = "${EXPECTED_BUN_REVISION}"

    - name: Install system dependencies
      if: inputs.system-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
        sudo ln -s $(which fdfind) /usr/local/bin/fd

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      # Not the release workflows' `--ignore-scripts --linker hoisted`: tests
      # need the trusted lifecycle scripts (better-sqlite3's native binding)
      # and the isolated layout a default install produces (per-workspace
      # node_modules/.bin, e.g. geist-console's vite). Bun still runs only the
      # scripts of trusted dependencies.
      run: bun install --frozen-lockfile
