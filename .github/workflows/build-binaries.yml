name: Build Binaries

on:
  push:
    tags:
      - 'v*'

env:
  RELEASE_TAG: ${{ github.ref_name }}
  BUN_PACKAGE_VERSION: 1.4.2
  BUN_REVISION: 1.4.2+744846f84

permissions: {}

jobs:
  build-runtime:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # setup-bun installs into ~/.bun/bin. `npm install --global` lands under the
      # runner's /opt toolcache, which the gateway refuses to exec from ("writable
      # by others: /opt"), failing the release test suite.
      - name: Install the pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_PACKAGE_VERSION }}

      - name: Verify the pinned Bun revision
        run: test "$(bun --revision)" = "${BUN_REVISION}"

      - name: Build Draht runtime assets
        run: ./scripts/build-binaries.sh

      - name: Upload immutable runtime build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: draht-runtime-${{ env.RELEASE_TAG }}
          path: |
            packages/coding-agent/binaries/draht-darwin-arm64.tar.gz
            packages/coding-agent/binaries/draht-darwin-x64.tar.gz
            packages/coding-agent/binaries/draht-linux-x64.tar.gz
            packages/coding-agent/binaries/draht-linux-arm64.tar.gz
            packages/coding-agent/binaries/draht-windows-x64.zip
            packages/coding-agent/binaries/runtime-manifest.json
            packages/coding-agent/binaries/DRAHT-SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  build-graph:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go/.go-version
          cache-dependency-path: go/go.sum

      - name: Build graph assets
        env:
          DRAHT_VERSION: ${{ env.RELEASE_TAG }}
        run: ./scripts/build-graph-binaries.sh

      - name: Upload immutable graph build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: draht-graph-${{ env.RELEASE_TAG }}
          path: |
            go/binaries/draht-graph-darwin-arm64.tar.gz
            go/binaries/draht-graph-darwin-x64.tar.gz
            go/binaries/draht-graph-linux-x64.tar.gz
            go/binaries/draht-graph-linux-arm64.tar.gz
            go/binaries/draht-graph-windows-x64.zip
            go/binaries/SHA256SUMS
            go/binaries/manifest.json
          if-no-files-found: error
          retention-days: 1

  attest:
    needs: [build-runtime, build-graph]
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Download runtime output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: draht-runtime-${{ env.RELEASE_TAG }}
          path: release-assets/runtime

      - name: Download graph output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: draht-graph-${{ env.RELEASE_TAG }}
          path: release-assets/graph

      - name: Attest every Draht runtime asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/runtime/draht-*.tar.gz
            release-assets/runtime/draht-*.zip
            release-assets/runtime/runtime-manifest.json
            release-assets/runtime/DRAHT-SHA256SUMS

      - name: Attest every graph asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/graph/draht-graph-*.tar.gz
            release-assets/graph/draht-graph-*.zip
            release-assets/graph/SHA256SUMS
            release-assets/graph/manifest.json

  release:
    needs: [build-runtime, build-graph, attest]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release metadata only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify immutable tag identity
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${RELEASE_TAG}")"

      - name: Download runtime output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: draht-runtime-${{ env.RELEASE_TAG }}
          path: release-assets/runtime

      - name: Download graph output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: draht-graph-${{ env.RELEASE_TAG }}
          path: release-assets/graph

      - name: Extract release notes
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk "/^## \\[${VERSION}\\]/{flag=1; next} /^## \\[/{flag=0} flag" packages/coding-agent/CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release ${VERSION}" > /tmp/release-notes.md
          fi

      - name: Create immutable complete GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing to mutate immutable release assets." >&2
            exit 1
          fi
          assets=(
            release-assets/runtime/draht-darwin-arm64.tar.gz
            release-assets/runtime/draht-darwin-x64.tar.gz
            release-assets/runtime/draht-linux-x64.tar.gz
            release-assets/runtime/draht-linux-arm64.tar.gz
            release-assets/runtime/draht-windows-x64.zip
            release-assets/runtime/runtime-manifest.json
            release-assets/runtime/DRAHT-SHA256SUMS
            release-assets/graph/manifest.json
            release-assets/graph/SHA256SUMS
            release-assets/graph/draht-graph-darwin-arm64.tar.gz
            release-assets/graph/draht-graph-darwin-x64.tar.gz
            release-assets/graph/draht-graph-linux-x64.tar.gz
            release-assets/graph/draht-graph-linux-arm64.tar.gz
            release-assets/graph/draht-graph-windows-x64.zip
          )
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --notes-file /tmp/release-notes.md \
            "${assets[@]}"
