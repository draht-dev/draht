name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    # Phase 33 added three spawned-process/browser suites on top of Phase 32's.
    # A hung spawn is the failure mode this job is most exposed to, so the job
    # is bounded here rather than left on the 6h default. Measured wall time on
    # a 14-core dev box: ~52s for the serial spawned-process group, ~107s for
    # the concurrent scripts group, minutes for build+check. 60 is roomy on a
    # 4-vCPU runner and still fails fast when something wedges.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Check
        run: bun run check

      # The headless-browser harness (scripts/browser-harness.mjs, R32-FLEET.12)
      # runs as part of `bun run test`. playwright-core ships no browser of its
      # own, so Chromium is installed explicitly here — without this step the
      # browser tests fail loudly rather than silently skipping.
      #
      # Three suites now depend on this step, not one:
      #   scripts/browser-harness.test.mjs          (R32-FLEET.12)
      #   scripts/geist-console-bundle.e2e.test.mjs (R32-FLEET.12)
      #   scripts/geist-reach-browser.e2e.test.mjs  (R33-REACH.4/.9/.10, mobile-emulated)
      # All three are in the `test:scripts:serial` group, which runs them one
      # file at a time so only one Chromium is alive at a time.
      - name: Install Chromium for the browser harness
        run: bunx playwright-core install --with-deps chromium

      # CI runs the ROOT script verbatim — not a hand-picked subset — so there is
      # exactly one definition of "the Phase 33 suite" and CI cannot drift from
      # what a developer gets locally. The run budget lives in package.json:
      # `test:scripts` runs the fast suites at node's default file concurrency,
      # `test:scripts:serial` runs the spawned-process/browser suites with
      # --test-concurrency=1, and both declare --test-timeout so a wedged spawn
      # fails instead of eating the job. scripts/root-test-script-parity.test.mjs
      # fails if any suite under scripts/ is left out of that chain.
      #
      # KNOWN RED, DELIBERATELY: packages/gateway's
      # "the pinned identity-header contract > is a real capture, not the
      # placeholder this repo ships" fails until a human captures the real
      # tailnet identity header from a live tailnet. Nothing in CI can clear it
      # and nothing in CI should hide it. It is cleared by running, on a machine
      # joined to the tailnet:
      #   node scripts/geist-tailscale-serve.mjs --capture-identity --peer NODE \
      #     --out packages/gateway/src/__tests__/fixtures/tailnet-identity.captured.json
      # Do not skip, exclude or continue-on-error this step to go green.
      - name: Test
        timeout-minutes: 40
        run: bun run test

  go:
    name: Go (draht-graph)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Needed for internal/graph's parity test, which shells out to
        # `node .../draht-tools.cjs map-graph --quiet` in the untagged pass.
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/.go-version
          cache-dependency-path: go/go.sum

      # gofmt is a FAILING gate here (go/Makefile's `fmt` target only prints).
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: these files are not formatted"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Untagged pass: compiles all 206 bundled grammars. This is the pass
      # that proves every grammar name langset asks for actually EXISTS
      # upstream, and it is the one pass that runs the CJS shellout parity
      # test (internal/graph/parity_test.go).
      - name: go test (full grammar set)
        run: go test -count=1 ./...

      - name: Resolve shipped grammar tags
        id: tags
        run: echo "tags=$(go run ./cmd/grammar-tags)" >> "$GITHUB_OUTPUT"

      - name: go build (shipped grammar subset)
        run: |
          go build -trimpath -ldflags="-s -w" \
            -tags "${{ steps.tags.outputs.tags }}" \
            -o /tmp/draht-graph ./cmd/draht-tools
          ls -l /tmp/draht-graph

      # Tagged pass: the tag-coupling gate (internal/langset,
      # internal/parse/grammarsubset_test.go). Fails if a grammar the CLI
      # asks for was not actually compiled in by the tag list. -short skips
      # the CJS shellout parity test (already covered by the untagged pass).
      - name: go test (shipped grammar subset)
        run: go test -count=1 -short -tags "${{ steps.tags.outputs.tags }}" ./...

      # -race REQUIRES a C toolchain, so CGO_ENABLED=1 here and only here.
      # The project's own dev box has no C compiler at all, so this job is
      # the only place this project can get race coverage — keep it, do not
      # make it continue-on-error. ubuntu-latest ships gcc preinstalled.
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -count=1 -short -race ./...
