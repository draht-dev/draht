name: Scheduled Release

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Release even if only the post-release changelog commit follows the latest tag
        required: false
        default: false
        type: boolean

concurrency:
  group: scheduled-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_PACKAGE_VERSION: 1.3.13-canary.20260425.1
  BUN_REVISION: 1.3.14-canary.1+ed1c48f2b

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || vars.DRAHT_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require release credentials
        env:
          DRAHT_RELEASE_TOKEN: ${{ secrets.DRAHT_RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${DRAHT_RELEASE_TOKEN}" ]]; then
            echo "::error::DRAHT_RELEASE_TOKEN is not configured"
            exit 1
          fi
          if [[ -z "${NPM_TOKEN}" ]]; then
            echo "::error::NPM_TOKEN is not configured"
            exit 1
          fi

      - name: Checkout main with the release identity
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.DRAHT_RELEASE_TOKEN }}

      - name: Detect unreleased commits
        id: pending
        env:
          FORCE_RELEASE: ${{ inputs.force || false }}
        run: |
          if [[ "${FORCE_RELEASE}" == "true" ]]; then
            echo "should-release=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          latest_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [[ -z "${latest_tag}" ]]; then
            echo "should-release=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          pending_commit="$(git log --format='%H%x09%s' "${latest_tag}..HEAD" | awk -F '\t' '$2 != "chore: add [Unreleased] section for next cycle" { print $1; exit }')"
          if [[ -n "${pending_commit}" ]]; then
            echo "should-release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No substantive commits follow ${latest_tag}; skipping release."
            echo "should-release=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Node.js
        if: steps.pending.outputs.should-release == 'true'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install and verify pinned Bun canary
        if: steps.pending.outputs.should-release == 'true'
        run: |
          npm install --global "bun@${BUN_PACKAGE_VERSION}"
          test "$(bun --revision)" = "${BUN_REVISION}"

      - name: Install system dependencies
        if: steps.pending.outputs.should-release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install workspace dependencies
        if: steps.pending.outputs.should-release == 'true'
        run: bun install --frozen-lockfile --ignore-scripts --linker hoisted

      - name: Install Chromium for release tests
        if: steps.pending.outputs.should-release == 'true'
        run: bunx playwright-core install --with-deps chromium

      - name: Verify npm publication identity
        if: steps.pending.outputs.should-release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org

      - name: Build and check the release candidate
        if: steps.pending.outputs.should-release == 'true'
        run: |
          bun run build
          npm run check

      - name: Refuse a stale checkout
        if: steps.pending.outputs.should-release == 'true'
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Release and publish
        if: steps.pending.outputs.should-release == 'true'
        env:
          GH_TOKEN: ${{ secrets.DRAHT_RELEASE_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release
